    <script>
      // SPA redirect handling for GitHub Pages (spa-github-pages).
      // 404.html encodes the requested path into a query parameter like ?/experience;
      // this decodes it back before React boots so BrowserRouter sees the real route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
