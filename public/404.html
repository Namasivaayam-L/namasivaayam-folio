<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script takes the current path and converts it into a query
    // parameter that index.html decodes back to the original route,
    // so that direct visits, refreshes, and bookmarks work on GitHub Pages.
    (function (l) {
      // Number of path segments to keep when rebuilding the base path.
      // For a project site at /namasivaayam-folio/ this is 1.
      var pathSegmentsToKeep = 1;

      if (l.pathname.startsWith('/')) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    })(location);
  </script>
</head>
<body>
</body>
</html>
